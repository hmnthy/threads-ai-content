# Cài: `uv run pre-commit install` (tự cài cả pre-commit lẫn commit-msg nhờ default_install_hook_types)
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Windows path — đổi sang uv/.venv/bin khi chuyển runtime sang WSL2 (roadmap Phase C)
        entry: ./.venv/Scripts/python.exe -m mypy
        language: system
        files: ^(src|tests|scripts)/
        pass_filenames: false
      # Cảnh sát nhất quán (ADR-0008): chặn commit đưa vào thông tin lỗi thời so với quyết định
      # đã chốt, đường dẫn chết, 3 README lệch nhau, số test sai. Sổ luật: docs/decisions/invariants.toml
      # --commit quét TOÀN repo (~6s), không chỉ file stage: lỗi đếm số / đường dẫn chết thường
      # nằm ở file khác file đang sửa (lỗ hổng 2026-10-01).
      - id: consistency
        name: decision consistency (invariants.toml)
        entry: ./.venv/Scripts/python.exe -m scripts.consistency.check --commit
        language: system
        pass_filenames: false
        always_run: true
      # Cổng review tầng 2 (ADR-0015): chỉ khi CLAUDECODE=1 (commit do Claude chạy) — file logic
      # / ADR sắp commit phải có dấu code-reviewer / consistency-auditor khớp đúng nội dung.
      # Đặt trước pytest-fast: thiếu dấu thì báo ngay, không chờ ~20s test.
      - id: review-gate
        name: tier-2 review gate (Claude commits only)
        entry: ./.venv/Scripts/python.exe scripts/review_gate.py check
        language: system
        pass_filenames: false
        always_run: true
      # Test nhanh (~20s): bỏ test tải model (slow) và gọi API thật (live).
      # Bộ đầy đủ chạy ở /checkpoint và bước kiểm tra cuối của /decision-sweep.
      - id: pytest-fast
        name: pytest (not slow, not live)
        entry: ./.venv/Scripts/python.exe -m pytest -q -x -m "not slow and not live" -p no:cacheprovider
        language: system
        files: ^(src|tests|scripts)/|^pyproject\.toml$|^docs/decisions/invariants\.toml$
        pass_filenames: false
      - id: dashboard
        name: dashboard eslint + tsc
        entry: ./.venv/Scripts/python.exe scripts/precommit/dashboard_check.py
        language: system
        files: ^src/dashboard/(src/|scripts/|package\.json|tsconfig\.json|eslint\.config|next\.config)
        pass_filenames: false
      # Chốt chặn tầng git cho quy tắc "không trailer Co-Authored-By" — áp dụng cả khi
      # commit tay ngoài Claude Code (hook PreToolUse chỉ bảo vệ commit do Claude chạy).
      - id: no-coauthor-trailer
        name: no Co-Authored-By trailer
        language: pygrep
        entry: "(?i)^co-authored-by:"
        stages: [commit-msg]
