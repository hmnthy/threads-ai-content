fix = "Ghi 'reply của tác giả' (1.368 tại 2026-09-30)"

[[forbid]]
id = "FACT-design-sync-direction"
adr = "fact-designsync"
pattern = '(?i)design-sync[^\n]{0,80}\bpull\b|\bpull\b[^\n]{0,60}design-sync'
why = "/design-sync ĐẨY component từ local lên Claude Design; chiều ngược chỉ đọc từng file (get_file), không pull cả trang"
