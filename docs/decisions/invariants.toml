# ---------------------------------------------------------------------------------------
# File nhị phân phải làm lại sau ADR
# ---------------------------------------------------------------------------------------

[[stale_asset]]
id = "ADR0001-landing-screenshot"
adr = "0001"
path = "docs/screenshots/landing.png"
regenerate = "Chạy backend + `npm run dev`, rồi `npm run screenshots` trong src/dashboard"

# ---------------------------------------------------------------------------------------
# Giới hạn kích thước (ADR-0003)
# ---------------------------------------------------------------------------------------

[[max_lines]]
path = "CLAUDE.md"
max = 80

[[max_lines]]
path = "docs/status.md"
max = 60

# ---------------------------------------------------------------------------------------
# Số liệu phải khớp thực tế (chỉ chạy ở --all)
# ---------------------------------------------------------------------------------------

[[count_fact]]
id = "FACT-test-count"
pattern = '(?i)(?P<n>\d+)(%20|\s)+tests?\b(?!\s*(file|module))'
paths = ["README*.md", "docs/status.md", "CLAUDE.md", "docs/claude/**"]
