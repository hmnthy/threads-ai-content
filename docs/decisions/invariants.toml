pattern = '(?i)(routing|quy tắc)[^|\n]{0,40}`?CLAUDE\.md`?\s*§'
why = "Quy tắc design routing đã chuyển từ CLAUDE.md sang .claude/rules/dashboard.md"
fix = "Trỏ tới .claude/rules/dashboard.md"
allow = ["docs/decisions/**"]

