id = "ADR0004-dbcv-unnamed"
adr = "0004"
# Chữ "DBCV" (viết hoa — không bắt tên biến `dbcv` trong code) đi với 1 số trong 25 ký tự
# trước/sau, mà trong 60 ký tự ngay sau "DBCV" không có tên hàm đo
pattern = '\bDBCV\b(?![^\n]{0,60}(validity_index|relative_validity))[^\n]{0,25}?\b0[.,]\d|\b0[.,]\d+\s*DBCV\b(?![^\n]{0,60}(validity_index|relative_validity))'
