id = "KB-no-separate-vectorstore"
adr = "roadmap-E"
pattern = '(?i)\b(chroma|faiss)\b'
why = "Knowledge base dùng SQLite (FTS5 + bảng embeddings), không dùng Chroma/FAISS"
fix = "Mô tả theo docs/roadmap.md Phase E"
