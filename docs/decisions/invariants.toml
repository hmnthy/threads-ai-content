# Sổ luật nhất quán — mỗi quyết định (ADR) khai báo những gì nó làm lỗi thời.
# Được kiểm bởi `scripts/consistency/check.py` (pre-commit chặn commit, /decision-sweep, CI).
#
# Thêm luật: mỗi ADR mới PHẢI thêm luật ở đây (skill /record-decision + /decision-sweep).
# Ngoại lệ có chủ đích: ghi `consistency: allow <id>` trên dòng vi phạm hoặc dòng ngay trước.
# Glob: `*` khớp mọi ký tự kể cả `/` (fnmatch) — `docs/archive/**` = mọi thứ dưới docs/archive.

[settings]
# Không quét: lưu trữ nguyên văn, vendored, file sinh tự động, và chính bộ luật + test của nó
exclude = [
  "docs/archive/**",
  "docs/decisions/legacy-log.md",
  "docs/decisions/invariants.toml",
  "tools/**",
  "src/dashboard/mockups/**",
  "uv.lock",
  "**package-lock.json",
  "scripts/consistency/**",
  "tests/scripts/test_consistency.py",
]
# Không kiểm đường dẫn chết (file có placeholder/ví dụ đường dẫn có chủ đích)
dead_path_exclude = [
  "docs/decisions/[0-9][0-9][0-9][0-9]-*.md",  # ADR là lịch sử bất biến — nhắc file đã xoá là đúng
  ".claude/skills/new-rq/template.md",
  "src/dashboard/AGENTS.md",
]
# Đường dẫn được nhắc tới trước khi tồn tại (roadmap) — xoá khỏi đây khi file đã được tạo
planned_paths = [
  "src/kb", "src/kb/**",
  "src/config.py",
  "src/pipeline/recluster.py",
  "tests/pipeline/test_recluster.py",
  "scripts/jobs", "scripts/jobs/**",
  "experiments", "experiments/**",
  "docs/rq", "docs/rq/**",
  ".claude/agent-memory", ".claude/agent-memory/**",
]
# Có thật trên máy nhưng gitignored → không tồn tại ở clone mới/CI; chấp nhận khi được nhắc tới
known_untracked = [
  ".env", ".venv", ".venv/**",
  "data", "data/**",
  "content", "content/**", "Content", "Content/**",
  "docs/research", "docs/research/**",
  "output", "output/**",
  "src/dashboard/.env.local",
  "src/dashboard/node_modules", "src/dashboard/node_modules/**",
  ".claude/worktrees", ".claude/worktrees/**",
  ".claude/settings.local.json", "CLAUDE.local.md",
]

