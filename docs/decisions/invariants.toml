pattern = '(?i)carousel(?![ _]album)'
why = "Carousel đã bỏ vĩnh viễn (ADR-0001) — chỉ giữ enum CAROUSEL_ALBUM của Threads API"
fix = "Xoá tham chiếu tới carousel"
allow = ["docs/decisions/**", "docs/roadmap.md"]

[[forbid]]
id = "ADR0001-image-gen"
adr = "0001"
pattern = '(?i)\bpillow\b|google[ _]sans|image generation'
why = "Pillow/font Google Sans chỉ phục vụ carousel — đã gỡ (ADR-0001)"
fix = "Xoá tham chiếu"
allow = ["docs/decisions/**"]

[[forbid]]
id = "ADR0001-kol"
adr = "0001"
pattern = '(?i)\bKOL\b|strategy engine'
why = "KOL Strategy Engine đã bỏ (ADR-0001)"
fix = "Xoá tham chiếu"
allow = ["docs/decisions/**"]

[[forbid]]
id = "ADR0001-phase12"
adr = "0001"
pattern = '(?i)\bphase(%20|[ _-])?[12]\b'
why = "Khái niệm Phase 1/Phase 2 đã bỏ — mốc hiện tại là phase C..F trong docs/roadmap.md"
fix = "Xoá, hoặc thay bằng mốc roadmap (VD 'Phase D0')"
allow = ["docs/decisions/**"]

[[forbid]]
id = "ADR0001-coming-soon"
adr = "0001"
pattern = '(?i)coming soon|sắp có|bientôt disponible'
