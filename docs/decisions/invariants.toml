# ---------------------------------------------------------------------------------------
# ADR-0003 — cấu trúc tài liệu + harness
# ---------------------------------------------------------------------------------------

[[forbid]]
id = "ADR0003-old-docs"
adr = "0003"
pattern = '(?<![\w/-])(next-steps\.md|sprint-plan\.md|project-summary\.md)|decisions log|Tech Stack đã chốt|Quyết định quan trọng đã chốt'
why = "3 file kế hoạch cũ đã vào docs/archive/; decisions log trong architecture.md đã tách thành ADR (ADR-0003)"
fix = "Trỏ tới docs/status.md, docs/roadmap.md, docs/decisions/ (ADR) hoặc docs/decisions/legacy-log.md"
allow = ["docs/decisions/**"]

[[forbid]]
id = "ADR0003-decisions-location"
adr = "0003"
multiline = true
pattern = '(?is)(quy tắc|quyết định|decisions?|décisions)[^.]{0,70}?(đã chốt|documented|documentées|tài liệu)[^.]{0,40}?architecture\.md'
why = "Quyết định/quy tắc không còn nằm trong architecture.md — đã tách thành ADR trong docs/decisions/ (ADR-0003)"
fix = "Trỏ tới docs/decisions/ (và CLAUDE.md cho quy tắc tuyệt đối)"
allow = ["docs/decisions/**"]

[[forbid]]
id = "ADR0003-sprint-steps"
adr = "0003"
pattern = '\b(Bước|Ngày) \d+(\.\d+)?(?![/\d])'
why = "Đánh số 'Bước N'/'Ngày N' thuộc sprint plan v3 đã archive — người đọc không tra được nữa"
fix = "Mô tả bằng tên module/việc, hoặc trỏ phase trong docs/roadmap.md"
# Chỉ code + docs tham chiếu: skill/rule dùng "Bước 1..N" để đánh số quy trình của chính nó là hợp lệ
paths = ["src/**", "tests/**", "scripts/**", "docs/claude/**", "README*.md", "CLAUDE.md"]
allow = ["docs/decisions/**"]

[[forbid]]
id = "ADR0003-skill-path"
